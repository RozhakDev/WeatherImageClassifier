[pytest]
minversion = 8.0
testpaths = API/tests
pythonpath = API
addopts = -ra -v --tb=short --strict-markers --strict-config
filterwarnings =
    ignore::DeprecationWarning
    ignore::starlette.exceptions.StarletteDeprecationWarning
markers =
    unit: Pengujian unit terisolasi tanpa server HTTP
    integration: Pengujian integrasi endpoint HTTP end-to-end
    security: Pengujian kepatuhan keamanan dan proteksi payload
    validation: Pengujian validasi skema input dan penanganan error
